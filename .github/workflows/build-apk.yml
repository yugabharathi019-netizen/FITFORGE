
name: Build FITFORGE APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -o FITFORGE-Android-Project.zip -d fitforge-src

      - name: Align Java and Kotlin targets
        run: |
          PROJECT_FILE=$(find fitforge-src -name settings.gradle.kts -print -quit)
          if [ -z "$PROJECT_FILE" ]; then
            echo "Android project settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          find "$PROJECT_DIR" -name '*.gradle.kts' -exec sed -i \
            -e 's/VERSION_1_8/VERSION_17/g' \
            -e 's/jvmTarget = "1.8"/jvmTarget = "17"/g' {} +

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FITFORGE-APK
          path: fitforge-src/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
