
name: Build FITFORGE APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
      - name: Align Java and Kotlin targets
        working-directory: fitforge-src
        run: |
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' app/build.gradle.kts
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' app/build.gradle.kts
          sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" app/build.gradle.kts
          
          unzip -o FITFORGE-Android-Project.zip -d fitforge-src

      - name: Build APK
        working-directory: fitforge-src
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FITFORGE-APK
          path: fitforge-src/app/build/outputs/apk/debug/app-debug.apk
          
